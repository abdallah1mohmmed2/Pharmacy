name: Pharmacy Flutter CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pharmacy-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --org com.globalpharmacy .
      - name: Set Android compile SDK to 36 for current plugins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          replacements = {
              "compileSdk = flutter.compileSdkVersion": "compileSdk = 36",
              "compileSdkVersion flutter.compileSdkVersion": "compileSdkVersion 36",
          }
          for path in candidates:
              if not path.exists():
                  continue
              content = path.read_text()
              updated = content
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != content:
                  path.write_text(updated)
                  print(f"Configured compile SDK 36 in {path}")
                  break
          else:
              raise SystemExit("Could not locate Flutter Android compileSdk declaration")
          PY
      - run: flutter pub get
      - name: Normalize Android plugin compile SDK when explicitly declared
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          # Plugin compile SDK overrides are optional. The app module is already
          # pinned to API 36 above; only normalize plugin declarations that exist.
          roots = [
              Path.home() / ".pub-cache" / "hosted" / "pub.dev",
              Path("/root/.pub-cache/hosted/pub.dev"),
          ]
          root = next((candidate for candidate in roots if candidate.exists()), None)
          if root is None:
              print("Pub cache directory not found; keeping app compile SDK 36.")
              raise SystemExit(0)

          pattern = re.compile(
              r"(?m)^(\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?)"
              r"(?:flutter\\.compileSdkVersion|\\d+)"
          )
          changed = []
          scanned = 0
          for gradle_file in root.rglob("build.gradle*"):
              if "android" not in gradle_file.parts:
                  continue
              try:
                  original = gradle_file.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  continue
              scanned += 1
              updated = pattern.sub(r"\\g<1>36", original)
              if updated != original:
                  gradle_file.write_text(updated, encoding="utf-8")
                  changed.append(str(gradle_file))

          print(f"Scanned {scanned} Android plugin Gradle files.")
          if changed:
              print("Normalized explicit plugin compile SDK declarations to API 36:")
              print("\\n".join(changed))
          else:
              print(
                  "No explicit plugin compile SDK declarations needed normalization; "
                  "the app compile SDK remains pinned to API 36."
              )
          PY
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Package Android APK into one ZIP
        run: zip -j pharmacy-android.zip build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Android ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-android
          path: pharmacy-android.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows --org com.globalpharmacy .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build windows --release
      - name: Package Windows release into one ZIP
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "pharmacy-windows.zip" -Force
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-windows
          path: pharmacy-windows.zip
          if-no-files-found: error
