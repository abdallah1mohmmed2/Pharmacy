name: Pharmacy Flutter CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pharmacy-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --org com.globalpharmacy .
      - name: Set Android compile SDK to 36 for current plugins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          replacements = {
              "compileSdk = flutter.compileSdkVersion": "compileSdk = 36",
              "compileSdkVersion flutter.compileSdkVersion": "compileSdkVersion 36",
          }
          for path in candidates:
              if not path.exists():
                  continue
              content = path.read_text()
              updated = content
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != content:
                  path.write_text(updated)
                  print(f"Configured compile SDK 36 in {path}")
                  break
          else:
              raise SystemExit("Could not locate Flutter Android compileSdk declaration")
          PY
      - run: flutter pub get
      - name: Set Android plugin modules compile SDK to 36
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          patterns = [
              (re.compile(r"(?m)^(\\s*compileSdkVersion\\s+)(?:flutter\\.compileSdkVersion|\\d+)"), r"\\g<1>36"),
              (re.compile(r"(?m)^(\\s*compileSdk\\s*=\\s*)(?:flutter\\.compileSdkVersion|\\d+)"), r"\\g<1>36"),
          ]
          changed = []
          for path in root.glob("*/android/build.gradle*"):
              content = path.read_text()
              updated = content
              for pattern, replacement in patterns:
                  updated = pattern.sub(replacement, updated)
              if updated != content:
                  path.write_text(updated)
                  changed.append(str(path))
          for required in ("file_picker", "flutter_plugin_android_lifecycle"):
              matches = [p for p in changed if f"/{required}-" in p]
              if not matches:
                  raise SystemExit(f"Could not enforce compile SDK 36 for {required}")
          print("Configured Android plugin modules for compile SDK 36:")
          print("\\n".join(changed))
          PY
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Package Android APK into one ZIP
        run: zip -j pharmacy-android.zip build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Android ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-android
          path: pharmacy-android.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows --org com.globalpharmacy .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build windows --release
      - name: Package Windows release into one ZIP
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "pharmacy-windows.zip" -Force
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-windows
          path: pharmacy-windows.zip
          if-no-files-found: error
