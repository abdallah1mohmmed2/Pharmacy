name: UI UX Mobile Overhaul Validation

on:
  push:
    branches:
      - feature/ui-ux-mobile-overhaul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ux-mobile-overhaul-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Format, analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-ui-ux-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Analyze and build Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform scaffolding
        run: flutter create --platforms=windows .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pharmacy-windows-release.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-ui-ux-windows
          path: pharmacy-windows-release.zip
          if-no-files-found: error
          retention-days: 14
